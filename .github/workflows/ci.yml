name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Dummy-URL: src/lib/prisma.ts parst DATABASE_URL beim Modul-Load.
      # Es wird keine echte DB-Verbindung aufgebaut (Build/Test verbinden nicht).
      DATABASE_URL: "mysql://build:build@127.0.0.1:3306/build"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma-Client generieren
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Deployment-Konfiguration testen
        run: |
          bash -n deploy/update.sh
          python3 -m unittest discover -s deploy -p 'test_*.py'

      - name: Build
        run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ssp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/ssp_test"
      E2E_DATABASE_URL: "mysql://root:root@127.0.0.1:3306/ssp_test"
      E2E_ADMIN_PASSWORD: "e2e-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: DB-Schema einspielen
        run: mysql -h 127.0.0.1 -u root -proot ssp_test < database/schema.sql

      - name: Prisma-Client generieren
        run: npx prisma generate

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: E2E-Tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    # Image nur bei Pushes bauen/pushen (nicht bei PRs – dort fehlen die Secrets).
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker-Metadaten (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kfmdm/smart-student-picker
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Bei Docker Hub anmelden
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
